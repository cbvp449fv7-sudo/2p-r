<header class="sticky top-0 z-40 border-b border-ink/8 bg-page/95 backdrop-blur-md">
  <div class="wrap flex h-[70px] items-center justify-between gap-4">
    <a href="{{PREFIX}}index.html" class="flex items-center gap-3" aria-label="{{BRAND}} — الصفحة الرئيسية">
      <picture>
        <source type="image/webp" srcset="{{PREFIX}}assets/images/brand/logo.webp">
        <img src="{{PREFIX}}assets/images/brand/logo.png" alt="" width="44" height="44" class="h-11 w-11 rounded-full">
      </picture>
      <span class="font-display text-lg font-bold leading-tight">{{BRAND_SHORT}}<span class="block text-[11px] font-sans font-normal tracking-widest text-ink-mute">للخياطة</span></span>
    </a>

    <nav class="hidden items-center gap-7 text-[15px] md:flex" aria-label="التنقّل الرئيسي">
      {{{NAV_DESKTOP}}}
    </nav>

    <a href="{{WA_GENERAL}}" class="btn-wa hidden !px-5 !py-2.5 !text-sm sm:inline-flex" target="_blank" rel="noopener">اطلبي عبر واتساب</a>

    <button type="button" id="burger" class="tap -m-2.5 flex h-11 w-11 items-center justify-center md:hidden" aria-expanded="false" aria-controls="mobnav" aria-label="فتح القائمة">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>

  <nav id="mobnav" class="hidden border-t border-ink/8 bg-page md:hidden" aria-label="التنقّل للجوال">
    <div class="wrap flex flex-col py-2">
      {{{NAV_MOBILE}}}
      <a href="{{WA_GENERAL}}" class="btn-wa my-3" target="_blank" rel="noopener">اطلبي عبر واتساب</a>
    </div>
  </nav>
</header>
